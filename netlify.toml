[build]
publish = "public"

# Browser API calls stay on the frontend origin. This avoids CORS failures for
# the custom domain, Netlify domain, and deploy previews while preserving the
# backend's existing /api contract.
[[redirects]]
from = "/api/*"
to = "https://access-wealth-backend-production.up.railway.app/api/:splat"
status = 200
force = true
headers = { Origin = "https://accesswealthhq.com" }

[[redirects]]
from = "/"
to = "/login.html"
status = 200

# Preserve the existing static-site fallback. Redirect rules intentionally live
# in this file so the API proxy above is evaluated before the catch-all.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
