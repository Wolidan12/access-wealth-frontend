[build]
publish = "public"

# Same-origin /api/* must reach Railway. force=true prevents the static
# fallback from serving index.html for /api/health and /api/login.
[[redirects]]
from = "/api/*"
to = "https://access-wealth-backend-production.up.railway.app/api/:splat"
status = 200
force = true

[[redirects]]
from = "/"
to = "/login.html"
status = 200

# Preserve the existing static-site fallback. Redirect rules intentionally live
# in this file so the API proxy above is evaluated before the catch-all.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
