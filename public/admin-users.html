<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
        :root { --bg-body: #070d14; --bg-cards: #112A46; --text-main: #ffffff; --text-muted: #8a99af; --primary-yellow: #d4af37; --border-light: rgba(212, 175, 55, 0.15); --sidebar-width: 260px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden;}

        .sidebar { width: var(--sidebar-width); background: #0b1a2a; height: 100vh; position: fixed; border-right: 1px solid var(--border-light); z-index: 1100; display: flex; flex-direction: column; }
        .logo-area { padding: 25px 20px; font-size: 18px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ff4d4d; display: flex; align-items: center; gap: 10px;}
        .nav-menu { padding: 20px 15px; overflow-y: auto; flex-grow: 1; }
        .nav-item { display: flex; align-items: center; padding: 12px 15px; color: var(--text-muted); text-decoration: none; border-radius: 8px; margin-bottom: 5px; font-size: 14px; transition: 0.3s; }
        .nav-item i { margin-right: 15px; width: 20px; text-align: center; }
        .nav-item:hover, .nav-item.active { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; }

        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); padding: 40px; }
        .page-header { margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; display: flex; justify-content: space-between; align-items: center;}
        .page-header h1 { font-size: 28px; color: var(--text-main); }
        .page-header p { color: var(--text-muted); font-size: 14px; }

        .search-bar { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 50px; display: flex; align-items: center; width: 300px;}
        .search-bar input { background: transparent; border: none; outline: none; color: #fff; width: 100%; margin-left: 10px; font-family: 'Poppins', sans-serif;}

        .card { background: var(--bg-cards); border: 1px solid var(--border-light); border-radius: 20px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 18px 25px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        th { color: var(--text-muted); font-weight: 500; background: rgba(0,0,0,0.1); text-transform: uppercase; font-size: 12px; letter-spacing: 1px;}
        .badge { padding: 5px 12px; border-radius: 50px; font-size: 11px; font-weight: 600; }
        .badge.active { background: rgba(46, 204, 113, 0.1); color: #2ecc71; }
        .badge.inactive { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }
        .action-btn { background: transparent; border: 1px solid var(--border-light); color: var(--text-main); padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-size: 12px;}
        .action-btn:hover { background: #ff4d4d; border-color: #ff4d4d; color: #fff; }
        .plan-btn { border-color: var(--primary-yellow); color: var(--primary-yellow); margin-left: 6px; }
        .plan-btn:hover { background: var(--primary-yellow); border-color: var(--primary-yellow); color: #0b1421; }
        .plan-modal { display:none; position:fixed; inset:0; z-index:2000; padding:20px; background:rgba(3,12,32,.65); align-items:center; justify-content:center; }
        .plan-modal.open { display:flex; }
        .plan-modal-card { width:min(100%, 420px); padding:26px; border-radius:16px; background:var(--bg-cards); border:1px solid var(--border-light); box-shadow:0 20px 50px rgba(0,0,0,.35); }
        .plan-modal-card h2 { margin-bottom:8px; font-size:20px; }
        .plan-modal-card p { color:var(--text-muted); margin-bottom:20px; font-size:13px; }
        .plan-modal-card select { width:100%; padding:12px; border-radius:8px; border:1px solid var(--border-light); background:rgba(0,0,0,.15); color:var(--text-main); margin-bottom:18px; }
        .plan-modal-actions { display:flex; justify-content:flex-end; gap:10px; }
        .plan-modal-actions button { padding:10px 15px; border-radius:8px; cursor:pointer; font-weight:600; }
        .plan-cancel { background:transparent; color:var(--text-main); border:1px solid var(--border-light); }
        .plan-confirm { background:var(--primary-yellow); color:#0b1421; border:0; }

    </style>
    <link rel="stylesheet" href="/brand.css">
    <script src="/brand.js" defer></script>
</head>
<body>
    <div class="sidebar">
        <div class="logo-area"><i class="fa-solid fa-shield-halved"></i> ADMIN PANEL</div>
        <div class="nav-menu">
            <a href="/admin.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Overview</a>
            <a href="/admin-users.html" class="nav-item active"><i class="fa-solid fa-users"></i> Manage Users</a>
            <a href="/support-agent.html" class="nav-item"><i class="fa-solid fa-headset"></i> Support Desk</a>
            <a href="/login.html" class="nav-item aw-sidebar-logout-admin" onclick="window.logout(); return false;"><i class="fa-solid fa-power-off"></i> Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">
            <div>
                <h1>Manage Users</h1>
                <p>View, edit, or ban registered users.</p>
            </div>
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass aw-muted-icon"></i>
                <input type="text" id="searchInput" placeholder="Search username">
            </div>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table id="usersTable">
                    <thead>
                        <tr><th scope="col">Username</th><th scope="col">Deposit Bal</th><th scope="col">Task Earnings</th><th scope="col">Affiliate Bal</th><th scope="col">Plan Status</th><th scope="col">Joined</th><th scope="col">Actions</th></tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="7" class="aw-table-loading">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="plan-modal" id="changePlanModal" role="dialog" aria-modal="true" aria-labelledby="changePlanTitle">
        <div class="plan-modal-card">
            <h2 id="changePlanTitle">Change User Plan</h2>
            <p>Assign a new package to <strong id="changePlanUsername"></strong>. This replaces any active plan.</p>
            <select id="changePlanPackage" aria-label="Select package"><option value="">Loading packages…</option></select>
            <div class="plan-modal-actions">
                <button type="button" class="plan-cancel" onclick="closeChangePlanModal()">Cancel</button>
                <button type="button" class="plan-confirm" id="changePlanSubmit">Change Plan</button>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        let allUsers = [];
        let selectedPlanUsername = null;

        function formatAmount(value) {
            const amount = Number(value);
            return `₦${(Number.isFinite(amount) ? amount : 0).toLocaleString()}`;
        }

        function showPageMessage(type, message) {
            if (typeof window.showToast === 'function') window.showToast(type, message);
            else alert(message);
        }

        function createCell(row, content, className = '') {
            const cell = document.createElement('td');
            if (className) cell.className = className;
            if (content instanceof Node) cell.appendChild(content);
            else cell.textContent = content;
            row.appendChild(cell);
            return cell;
        }

        async function loadUsers() {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Loading users...</td></tr>';
            try {
                const { ok, data, networkError } = await window.apiFetchJson('/admin/users');
                if (!(ok && data.success && Array.isArray(data.users))) {
                    const message = networkError ? 'Unable to reach the user service.' : data?.error || 'Unable to load users.';
                    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#ff6b6b;">${window.escapeHtml(message)}</td></tr>`;
                    return;
                }
                allUsers = data.users;
                displayUsers(allUsers);
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#ff6b6b;">Unable to load users.</td></tr>';
            }
        }

        function displayUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            tbody.replaceChildren();
            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No users found.</td></tr>';
                return;
            }

            users.forEach((user) => {
                const row = document.createElement('tr');
                const username = String(user.username || 'Unknown user');
                const usernameStrong = document.createElement('strong');
                usernameStrong.textContent = username;
                createCell(row, usernameStrong);
                createCell(row, formatAmount(user.balance));
                createCell(row, formatAmount(user.taskEarnings));
                createCell(row, formatAmount(user.affiliate_balance));

                const planCell = document.createElement('td');
                const badge = document.createElement('span');
                const isActive = user.planActivated === true || user.planActivated === 'true';
                badge.className = `badge ${isActive ? 'active' : 'inactive'}`;
                badge.textContent = isActive ? (user.activePackage || 'Active') : 'No Plan';
                planCell.appendChild(badge);
                row.appendChild(planCell);

                const joined = user.created_at ? new Date(user.created_at) : null;
                createCell(row, joined && !Number.isNaN(joined.getTime()) ? joined.toLocaleDateString() : '—');

                const actions = document.createElement('td');
                const adjustButton = document.createElement('button');
                adjustButton.type = 'button';
                adjustButton.className = 'action-btn';
                adjustButton.textContent = 'Adjust Balance';
                adjustButton.addEventListener('click', () => editUser(username));
                actions.appendChild(adjustButton);

                const planButton = document.createElement('button');
                planButton.type = 'button';
                planButton.className = 'action-btn plan-btn';
                planButton.textContent = 'Change Plan';
                planButton.addEventListener('click', () => openChangePlanModal(username));
                actions.appendChild(planButton);
                row.appendChild(actions);
                tbody.appendChild(row);
            });
        }

        async function editUser(username) {
            const entered = prompt(`Enter a deposit-wallet adjustment for ${username}. Use a positive number to add funds or a negative number to subtract funds.`);
            if (entered === null) return;
            const adjustment = Number(entered);
            if (!Number.isFinite(adjustment) || adjustment === 0) {
                showPageMessage('error', 'Enter a non-zero numeric adjustment.');
                return;
            }
            const action = adjustment > 0 ? 'add' : 'subtract';
            const amount = Math.abs(adjustment);
            if (!confirm(`${action === 'add' ? 'Add' : 'Subtract'} ${formatAmount(amount)} ${action === 'add' ? 'to' : 'from'} ${username}'s deposit wallet?`)) return;

            try {
                const { ok, data, networkError } = await window.apiFetchJson('/admin/adjust-balance', {
                    method: 'POST',
                    body: JSON.stringify({ username, amount, walletType: 'balance', action })
                });
                if (!(ok && data.success)) throw new Error(networkError ? 'Unable to reach the balance service.' : data?.error || 'Unable to update the balance.');
                showPageMessage('success', data.message || 'Wallet updated successfully.');
                loadUsers();
            } catch (error) {
                showPageMessage('error', error.message || 'Unable to update the balance.');
            }
        }

        async function openChangePlanModal(username) {
            selectedPlanUsername = username;
            document.getElementById('changePlanUsername').textContent = username;
            const select = document.getElementById('changePlanPackage');
            select.replaceChildren(new Option('Loading packages…', ''));
            document.getElementById('changePlanModal').classList.add('open');
            try {
                const { ok, data } = await window.apiFetchJson('/packages');
                if (!(ok && data.success && Array.isArray(data.packages))) throw new Error(data?.error || 'Unable to load packages.');
                select.replaceChildren(new Option('Select a package', ''));
                data.packages.forEach((pkg) => {
                    const option = new Option(`${pkg.name || 'Package'} — ${formatAmount(pkg.capital ?? pkg.price)}`, pkg.id || '');
                    if ((allUsers.find((user) => user.username === username)?.activePackageId || '') === option.value) option.selected = true;
                    select.appendChild(option);
                });
            } catch (error) {
                select.replaceChildren(new Option('Unable to load packages', ''));
                showPageMessage('error', error.message || 'Unable to load packages.');
            }
        }

        function closeChangePlanModal() {
            document.getElementById('changePlanModal').classList.remove('open');
            selectedPlanUsername = null;
        }

        document.getElementById('changePlanSubmit').addEventListener('click', async () => {
            const packageId = document.getElementById('changePlanPackage').value;
            const button = document.getElementById('changePlanSubmit');
            if (!selectedPlanUsername || !packageId) {
                showPageMessage('error', 'Select a package first.');
                return;
            }
            if (!confirm(`Change ${selectedPlanUsername}'s plan? Any current active plan will be replaced.`)) return;
            button.disabled = true;
            button.textContent = 'Changing…';
            try {
                const { ok, data } = await window.apiFetchJson('/admin/change-user-plan', {
                    method: 'POST',
                    body: JSON.stringify({ username: selectedPlanUsername, packageId })
                });
                if (!(ok && data.success)) throw new Error(data?.error || 'Unable to change the user plan.');
                showPageMessage('success', data.message || 'User plan changed successfully.');
                closeChangePlanModal();
                loadUsers();
            } catch (error) {
                showPageMessage('error', error.message || 'Unable to change the user plan.');
            } finally {
                button.disabled = false;
                button.textContent = 'Change Plan';
            }
        });

        document.getElementById('searchInput').addEventListener('input', (event) => {
            const searchTerm = event.target.value.trim().toLowerCase();
            displayUsers(allUsers.filter((user) => String(user.username || '').toLowerCase().includes(searchTerm)));
        });

        window.onload = () => {
            if (localStorage.getItem('role') !== 'admin' || !localStorage.getItem('token')) {
                window.location.assign('/login.html');
                return;
            }
            loadUsers();
        };
    </script>
</body>
</html>
