<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Access Wealth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
        :root {
            --bg: #070d14;
            --surface: rgba(17,42,70,0.92);
            --surface-strong: #112A46;
            --text: #ffffff;
            --muted: #8a99af;
            --line: rgba(212,175,55,0.15);
            --accent: #d4af37;
            --accent-2: #b8860b;
            --accent-soft: rgba(212,175,55,0.12);
            --shadow: 0 20px 44px rgba(0,0,0,0.22);
            --shadow-soft: 0 12px 24px rgba(0,0,0,0.14);
            --good: #2ecc71;
            --danger: #ef4444;
        }
        html[data-theme="dark"] {
            --bg: #050b12;
            --surface: rgba(12,26,43,0.92);
            --surface-strong: #112A46;
            --text: #ffffff;
            --muted: #8a99af;
            --line: rgba(212,175,55,0.15);
            --accent-soft: rgba(212,175,55,0.12);
            --shadow: 0 20px 44px rgba(0,0,0,0.3);
            --shadow-soft: 0 12px 24px rgba(0,0,0,0.18);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, rgba(212,175,55,0.10), transparent 26%), var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        a { color: inherit; text-decoration: none; }
        button, input { font: inherit; }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 32px;
            padding: 32px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            position: relative;
        }
        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            color: var(--muted);
            cursor: pointer;
            transition: 160ms ease;
        }
        .theme-toggle:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
        }
        .auth-brand .brand-mark {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #fff;
            font-size: 1.4rem;
        }
        .auth-brand h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            margin: 0;
        }
        .auth-brand h1 span { color: #d4af37; }
        .auth-sub {
            text-align: center;
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 0.95rem;
        }
        .auth-sub strong { color: var(--text); }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4af37;
            font-size: 1.1rem;
        }
        .input-wrap input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(0,0,0,0.22);
            border: 1px solid var(--line);
            border-radius: 16px;
            color: var(--text);
            font-weight: 500;
            font-size: 1rem;
            outline: none;
            transition: 160ms ease;
        }
        .input-wrap input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212,175,55,0.14);
            background: rgba(0,0,0,0.30);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #fff;
            font-weight: 900;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 160ms ease;
            box-shadow: 0 4px 14px rgba(212,175,55,0.26);
            margin-top: 6px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212,175,55,0.32); }
        .btn-primary:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .auth-footer a {
            color: #d4af37;
            font-weight: 700;
        }
        .auth-footer a:hover { text-decoration: underline; }

        .auth-extra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin: 16px 0 6px;
            flex-wrap: wrap;
        }
        .auth-extra .link {
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .auth-extra .link:hover { color: #d4af37; }

        .error-msg {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.20);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 20px;
            color: #ef4444;
            display: none;
            font-weight: 600;
            font-size: 0.92rem;
        }

        @media (max-width: 480px) {
            .auth-card { padding: 24px; }
            .auth-brand h1 { font-size: 1.3rem; }
        }
    </style>
    <link rel="stylesheet" href="/brand.css">
    <script src="/brand.js" defer></script>
</head>
<body>
    <div class="auth-card">
        <!-- Theme toggle button (will be handled by global.js) -->
        <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
        </button>

        <div class="auth-brand">
            <span class="brand-mark"><i class="fa-solid fa-paper-plane"></i></span>
            <h1>Access <span>Wealth</span></h1>
        </div>
        <div class="auth-sub">
            <strong>Welcome back.</strong> Login to your dashboard.
        </div>

        <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginUsername">Username or email</label>
                <div class="input-wrap">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="loginUsername" name="username" placeholder="Enter your username or email" autocomplete="username" inputmode="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
            </div>

            <div class="auth-extra">
                <a href="/forgot-password.html" class="link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">Login to Dashboard</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/register.html">Create one now</a>
        </div>
    </div>

    <script src="/global.js"></script>
    <script src="/signin.js"></script>
    <script>
        (function() {
            const form = document.getElementById('loginForm');
            const btn = document.getElementById('loginBtn');
            const errorEl = document.getElementById('errorMsg');
            const defaultButtonLabel = 'Login to Dashboard';
            const SignIn = window.AccessWealthSignIn;
            let isSubmittingLogin = false;

            function showError(message) {
                errorEl.innerText = message;
                errorEl.style.display = 'block';
            }

            function resetButton() {
                btn.disabled = false;
                btn.innerHTML = defaultButtonLabel;
            }

            function storeLoginSession(session) {
                const { token, user } = session;
                const planActivated = user.planActivated === true || user.planActivated === 'true' || user.plan_activated === true || user.plan_activated === 'true';
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(user));
                localStorage.setItem('username', user.username || '');
                localStorage.setItem('role', user.role || 'user');
                localStorage.setItem('planActivated', planActivated ? 'true' : 'false');
                localStorage.setItem('activePackage', user.activePackage || '');
                localStorage.setItem('my_referral_id', user.my_referral_id || user.referralId || '');
            }

            function logLoginFailure({ response, data, error }) {
                console.error('Login request failed:', {
                    status: response ? response.status : undefined,
                    data: SignIn.redactAuthData(data),
                    error: error && error.message ? error.message : error
                });
            }

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                if (isSubmittingLogin) return;

                const fields = SignIn.validateLoginFields(
                    document.getElementById('loginUsername').value,
                    document.getElementById('loginPassword').value
                );
                if (!fields.ok) {
                    showError(fields.error);
                    return;
                }

                const username = fields.username;
                const password = fields.password;
                const request = SignIn.buildLoginRequest(username, password);

                isSubmittingLogin = true;
                errorEl.style.display = 'none';
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';
                let redirecting = false;
                let response;
                let data;

                try {
                    response = await fetch(request.url, {
                        method: request.method,
                        headers: request.headers,
                        body: request.body
                    });

                    const contentType = response.headers.get('content-type') || '';
                    const rawBody = await response.text();
                    data = SignIn.parseResponseBody(contentType, rawBody);

                    if (!response.ok) {
                        throw new Error(
                            SignIn.getSignInErrorMessage({ status: response.status, data }) ||
                            data.error ||
                            `Sign-in failed with HTTP ${response.status}`
                        );
                    }

                    const session = SignIn.extractLoginSession(data);
                    if (!session || !session.token || !session.user) {
                        throw new Error('The server returned an incomplete sign-in response.');
                    }

                    const user = {
                        ...session.user,
                        username: session.user.username || username
                    };

                    try {
                        localStorage.setItem('token', session.token);
                        localStorage.setItem('user', JSON.stringify(user));
                        storeLoginSession({ token: session.token, user });
                    } catch (storageError) {
                        console.error('Could not save login session:', storageError);
                        showError('Your browser could not save the sign-in session. Enable site storage and try again.');
                        return;
                    }

                    redirecting = true;
                    if (user.role === 'admin') {
                        window.location.href = '/admin.html';
                    } else if (user.role === 'support') {
                        window.location.href = '/support-agent.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                } catch (error) {
                    const networkError = !response;
                    const message = SignIn.getSignInErrorMessage({
                        status: response && response.status,
                        data,
                        networkError
                    });
                    logLoginFailure({ response, data, error });
                    showError(networkError ? 'We could not complete sign-in. Please try again.' : (error && error.message) || message);
                } finally {
                    isSubmittingLogin = false;
                    if (!redirecting) resetButton();
                }
            });
        })();
    </script>
</body>
</html>
